name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  core:
    name: Build & test core engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (core + tests + cli, no JUCE)
        run: cmake -S . -B build -DRHYTHM_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
